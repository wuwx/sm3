name: run-tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '5.6'
            phpunit: '^5.7'
          - php: '7.0'
            phpunit: '^6.5'
          - php: '7.1'
            phpunit: '^7.5'
          - php: '7.2'
            phpunit: '^8.5'
          - php: '7.3'
            phpunit: '^9.5'
          - php: '7.4'
            phpunit: '^9.5'
          - php: '8.0'
            phpunit: '^9.5'
          - php: '8.1'
            phpunit: '^9.5'
          - php: '8.1'
            phpunit: '^10.5'
          - php: '8.2'
            phpunit: '^11.0'
          - php: '8.3'
            phpunit: '^9.5'
          - php: '8.4'
            phpunit: '^11.5'
          - php: '8.5'
            phpunit: '^12.0'

    name: P${{ matrix.php }} - phpunit ${{ matrix.phpunit }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - run: composer require "phpunit/phpunit:${{ matrix.phpunit }}" --no-interaction --no-update

      - run: composer update --prefer-dist --no-interaction --no-progress

      - run: composer validate --strict --no-check-publish

      - run: vendor/bin/phpunit
